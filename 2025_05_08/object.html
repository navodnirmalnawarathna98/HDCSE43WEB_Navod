<!DOCTYPE html>
<html>
<body>
<h1>Creating JavaScript Objects</h1>
<h2>Using an Object Literal</h2>

<p id="demo"></p>

<script>
// Create an Object:
const person = {
  firstName: "John",
  lastName: "Doe",
  age: 50,
  eyeColor: "blue"
};

console.log("My person Object",person);
console.log("My person name",person.firstName);

// Display Data from the Object:
document.getElementById("demo").innerHTML = person.firstName + " is " + person.age + " years old.";
</script>

</body>
</html>
